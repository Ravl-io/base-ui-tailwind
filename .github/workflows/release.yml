name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        task: [lint, build, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - run: pnpm ${{ matrix.task }}

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@ravl-io'

      - run: pnpm install

      - name: Check for changesets
        id: changesets
        run: |
          count=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version, publish, and release
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bump version and commit
          pnpm run bump
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add .
          git commit -m "chore: version bump to v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push
          git push --tags

          # Build and publish to GitHub Packages
          pnpm run release

          # Create GitHub Release with changelog
          CHANGELOG=$(sed -n "/^## ${NEW_VERSION}/,/^## [0-9]/p" CHANGELOG.md | sed '$d')
          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes "${CHANGELOG}" \
            --target main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
